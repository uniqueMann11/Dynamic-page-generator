<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.vw-card {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.vw-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft);
}

.vw-top .t {
  font-family: var(--ff-display);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

.vw-top .t svg { width: 16px; height: 16px; color: var(--primary); }

.vw-chip {
  font-family: var(--ff-mono);
  font-size: 0.66rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--green-tint);
  color: var(--green);
  border: 1px solid rgba(21, 154, 91, 0.25);
}

.vw-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.vw-horizon-bar {
  display: flex;
  gap: 6px;
}

.vw-hz-btn {
  flex: 1;
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-family: var(--ff-mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}

.vw-hz-btn:hover { border-color: var(--primary); color: var(--ink); }
.vw-hz-btn.active { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-strong); }

.vw-chart-box {
  background: var(--surface-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px;
  position: relative;
}

.vw-chart-legend {
  display: flex;
  justify-content: space-between;
  font-size: 0.64rem;
  font-family: var(--ff-mono);
  color: var(--muted);
  margin-bottom: 6px;
}

.vw-leg-item { display: flex; align-items: center; gap: 5px; }
.vw-dot-gray { width: 7px; height: 7px; border-radius: 50%; background: #94A3B8; }
.vw-dot-blue { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }

.vw-svg-chart {
  width: 100%;
  height: 95px;
  overflow: visible;
}

.vw-metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.vw-tile {
  background: var(--surface-alt);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  text-align: center;
}

.vw-tile-val {
  font-family: var(--ff-display);
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
}

.vw-tile-lbl {
  font-family: var(--ff-mono);
  font-size: 0.55rem;
  color: var(--muted);
  text-transform: uppercase;
}

.vw-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  border-top: 1px solid var(--line-soft);
  background: var(--surface-alt);
  font-size: 0.72rem;
  color: var(--muted);
}

@media (max-width: 480px) {
  .vw-metrics-row { grid-template-columns: repeat(2, 1fr); }
}
</style>

<div class="vw-card">
  <div class="vw-top">
    <span class="t">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      Training Pipeline Monitor
    </span>
    <span class="vw-chip" id="vwChipState">Convergence Rate: 0.0231</span>
  </div>

  <div class="vw-body">
    <div class="vw-horizon-bar">
      <button class="vw-hz-btn" data-horizon="7">Early Stopping</button>
      <button class="vw-hz-btn active" data-horizon="30">Best Epoch</button>
      <button class="vw-hz-btn" data-horizon="90">Full Run</button>
    </div>

    <div class="vw-chart-box">
      <div class="vw-chart-legend">
        <span class="vw-leg-item"><span class="vw-dot-gray"></span> Validation Loss</span>
        <span class="vw-leg-item"><span class="vw-dot-blue"></span> Learning Schedule</span>
      </div>

      <svg class="vw-svg-chart" viewBox="0 0 400 95">
        <defs>
          <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2456E6" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#2456E6" stop-opacity="0.02" />
          </linearGradient>
        </defs>

        <polygon id="expectedBand" points="200,45 250,38 300,30 350,24 390,18 390,65 350,70 300,75 250,80 200,45" fill="url(#bandGrad)" />

        <polyline points="10,75 50,65 90,55 130,48 170,46 200,45" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

        <polyline id="predLine" points="200,45 250,38 300,30 350,24 390,18" fill="none" stroke="#2456E6" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" />

        <circle cx="200" cy="45" r="4.5" fill="#2456E6" stroke="#FFFFFF" stroke-width="2" />
      </svg>
    </div>

    <div class="vw-metrics-row">
      <div class="vw-tile">
        <div class="vw-tile-val" id="valGrowth" style="color: var(--green);">0.0231</div>
        <div class="vw-tile-lbl">Convergence Rate</div>
      </div>
      <div class="vw-tile">
        <div class="vw-tile-val" style="color: var(--green);">97.4%</div>
        <div class="vw-tile-lbl">Validation Accuracy</div>
      </div>
      <div class="vw-tile">
        <div class="vw-tile-val">12/150</div>
        <div class="vw-tile-lbl">Epoch Progress</div>
      </div>
      <div class="vw-tile">
        <div class="vw-tile-val">125K</div>
        <div class="vw-tile-lbl">Parameters Trained</div>
      </div>
    </div>
  </div>

  <div class="vw-foot">
    <span>Arch: XGBoost + LightGBM Ensemble</span>
    <span>Jaipur • Handicraft Demand Data</span>
  </div>
</div>

<script>
(function () {
  const hzBtns = document.querySelectorAll(".vw-hz-btn");
  const vwChipState = document.getElementById("vwChipState");
  const valGrowth = document.getElementById("valGrowth");
  const predLine = document.getElementById("predLine");
  const expectedBand = document.getElementById("expectedBand");

  const horizonData = {
    "7": {
      chip: "Early Stop Epoch: 7",
      growth: "0.0418",
      line: "200,45 250,42 300,39 350,37 390,35",
      band: "200,45 250,38 300,32 350,28 390,25 390,48 350,50 300,52 250,50 200,45"
    },
    "30": {
      chip: "Convergence Rate: 0.0231",
      growth: "0.0231",
      line: "200,45 250,38 300,30 350,24 390,18",
      band: "200,45 250,30 300,20 350,15 390,10 390,65 350,70 300,75 250,80 200,45"
    },
    "90": {
      chip: "Final Test Loss: 0.0098",
      growth: "0.0098",
      line: "200,45 250,32 300,22 350,16 390,8",
      band: "200,45 250,22 300,12 350,8 390,2 390,75 350,80 300,85 250,82 200,45"
    }
  };

  hzBtns.forEach(btn => {
    btn.addEventListener("click", function () {
      hzBtns.forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      const key = this.getAttribute("data-horizon");
      const d = horizonData[key];
      if (d) {
        vwChipState.textContent = d.chip;
        valGrowth.textContent = d.growth;
        predLine.setAttribute("points", d.line);
        expectedBand.setAttribute("points", d.band);
      }
    });
  });
})();
</script>
