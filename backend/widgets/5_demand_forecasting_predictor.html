<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicting Next Month from Past Patterns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600" rel="stylesheet" />
  <style>
        :root, .svcp {
      --ink: #0A1222;
      --ink-soft: #1B2740;
      --body: #48566E;
      --muted: #6B7A93;
      --line: #E6ECF4;
      --line-soft: #EFF3F9;
      --surface: #FFFFFF;
      --soft: #F4F8FD;
      --tint: #EAF0FF;
      --blue: #2456E6;
      --blue-strong: #1740C0;
      --blue-tint: #E6EEFF;
      --violet: #6D5EF6;
      --violet-tint: #EDEAFE;
      --mint: #0FA968;
      --mint-tint: #E4F7EE;
      --mint-deep: #0B7D4E;
      --amber: #D97A18;
      --amber-tint: #FCEFDD;
      --rose: #E11D48;
      --rose-tint: #FFE8EE;
      --indigo: #4F46E5;
      --sh-sm: 0 1px 2px rgba(10, 18, 34, .04), 0 2px 6px rgba(10, 18, 34, .05);
      --sh-md: 0 14px 34px -16px rgba(10, 18, 34, .22);
      --sh-lg: 0 30px 70px -28px rgba(36, 86, 230, .32);
      --r: 18px;
      --r-sm: 12px;
      --maxw: 1200px;
      --disp: "Plus Jakarta Sans", system-ui, sans-serif;
      --bodyf: "Inter", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--bodyf); background: #F0F4FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .vw-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--sh-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .vw-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line-soft);
    }

    .vw-top .t {
      font-family: var(--disp);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vw-top .t svg { width: 16px; height: 16px; color: var(--blue); }

    .vw-chip {
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--mint-tint);
      color: var(--mint);
      border: 1px solid rgba(21, 154, 91, 0.25);
    }

    .vw-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vw-horizon-bar {
      display: flex;
      gap: 6px;
    }

    .vw-hz-btn {
      flex: 1;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 6px 10px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .vw-hz-btn:hover { border-color: var(--blue); color: var(--ink); }
    .vw-hz-btn.active { background: var(--blue-tint); border-color: var(--blue); color: var(--blue-strong); }

    .vw-chart-box {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 12px;
      position: relative;
    }

    .vw-chart-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.64rem;
      font-family: var(--mono);
      color: var(--muted);
      margin-bottom: 6px;
    }

    .vw-leg-item { display: flex; align-items: center; gap: 5px; }
    .vw-dot-gray { width: 7px; height: 7px; border-radius: 50%; background: #94A3B8; }
    .vw-dot-blue { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }

    .vw-svg-chart {
      width: 100%;
      height: 95px;
      overflow: visible;
    }

    .vw-metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .vw-tile {
      background: var(--soft);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-sm);
      padding: 6px 8px;
      text-align: center;
    }

    .vw-tile-val {
      font-family: var(--disp);
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink);
    }

    .vw-tile-lbl {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .vw-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-top: 1px solid var(--line-soft);
      background: var(--soft);
      font-size: 0.72rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .vw-metrics-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ============================ WIDGET START ============================ -->
  <div class="vw-card">
    <div class="vw-top">
      <span class="t">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Predicting Next Month from Past Trends
      </span>
      <span class="vw-chip" id="vwPredBadge">Forecast: +18.4%</span>
    </div>

    <div class="vw-body">
      <!-- Time Horizon Buttons -->
      <div class="vw-horizon-bar">
        <button class="vw-hz-btn" data-days="7">Next 7 Days</button>
        <button class="vw-hz-btn active" data-days="30">Next 30 Days</button>
        <button class="vw-hz-btn" data-days="90">Next Quarter</button>
      </div>

      <!-- Plain Visual Chart -->
      <div class="vw-chart-box">
        <div class="vw-chart-legend">
          <span class="vw-leg-item"><span class="vw-dot-gray"></span> Past Actual Sales</span>
          <span class="vw-leg-item"><span class="vw-dot-blue"></span> AI Predicted Trend</span>
        </div>

        <svg class="vw-svg-chart" viewBox="0 0 400 95">
          <defs>
            <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2456E6" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#2456E6" stop-opacity="0.02" />
            </linearGradient>
          </defs>

          <!-- Expected Range Band -->
          <polygon id="expectedBand" points="200,45 250,30 300,20 350,15 390,10 390,65 350,70 300,75 250,80 200,45" fill="url(#bandGrad)" />

          <!-- Past Line -->
          <polyline points="10,65 50,55 90,60 130,48 170,52 200,45" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />

          <!-- Future Predicted Line -->
          <polyline id="predLine" points="200,45 250,38 300,30 350,24 390,18" fill="none" stroke="#2456E6" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" />

          <!-- Pivot Point -->
          <circle cx="200" cy="45" r="4.5" fill="#2456E6" stroke="#FFFFFF" stroke-width="2" />
        </svg>
      </div>

      <!-- Plain Stats Grid -->
      <div class="vw-metrics-row">
        <div class="vw-tile">
          <div class="vw-tile-val" id="valGrowth" style="color: var(--mint);">+18.4%</div>
          <div class="vw-tile-lbl">Expected Growth</div>
        </div>
        <div class="vw-tile">
          <div class="vw-tile-val" style="color: var(--mint);">96.2%</div>
          <div class="vw-tile-lbl">Accuracy Track</div>
        </div>
        <div class="vw-tile">
          <div class="vw-tile-val">&lt;0.5%</div>
          <div class="vw-tile-lbl">Stockout Risk</div>
        </div>
        <div class="vw-tile">
          <div class="vw-tile-val">24 Days</div>
          <div class="vw-tile-lbl">Optimal Supply</div>
        </div>
      </div>
    </div>

    <div class="vw-foot">
      <span>Model: Temporal Fusion Transformer + Prophet</span>
      <span>Auto-adjusts for seasonal holidays</span>
    </div>
  </div>
  <!-- ============================ WIDGET END ============================ -->

  <script>
    (function () {
      const hzBtns = document.querySelectorAll(".vw-hz-btn");
      const vwPredBadge = document.getElementById("vwPredBadge");
      const valGrowth = document.getElementById("valGrowth");
      const predLine = document.getElementById("predLine");
      const expectedBand = document.getElementById("expectedBand");

      const horizonData = {
        "7": {
          badge: "Forecast: +6.2%",
          growth: "+6.2%",
          line: "200,45 250,42 300,39 350,37 390,35",
          band: "200,45 250,38 300,32 350,28 390,25 390,48 350,50 300,52 250,50 200,45"
        },
        "30": {
          badge: "Forecast: +18.4%",
          growth: "+18.4%",
          line: "200,45 250,38 300,30 350,24 390,18",
          band: "200,45 250,30 300,20 350,15 390,10 390,65 350,70 300,75 250,80 200,45"
        },
        "90": {
          badge: "Forecast: +42.8%",
          growth: "+42.8%",
          line: "200,45 250,32 300,22 350,16 390,8",
          band: "200,45 250,22 300,12 350,8 390,2 390,75 350,80 300,85 250,82 200,45"
        }
      };

      hzBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          hzBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const d = horizonData[btn.getAttribute("data-days")];
          if (d) {
            vwPredBadge.textContent = d.badge;
            valGrowth.textContent = d.growth;
            predLine.setAttribute("points", d.line);
            expectedBand.setAttribute("points", d.band);
          }
        });
      });
    })();
  </script>
</body>
</html>
